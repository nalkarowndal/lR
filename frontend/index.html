<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuxuryRental - Curated Luxury Living</title>
    <style>
      /* Tier 1 Native Inline Splash Screen: 0ms instant display before JS bundle loads */
      #native-splash {
        position: fixed;
        inset: 0;
        background-color: #0B0C0E;
        background-image: radial-gradient(circle at 50% 45%, rgba(197, 168, 128, 0.09) 0%, rgba(11, 12, 14, 0) 70%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 40px 24px;
        box-sizing: border-box;
        transition: opacity 0.35s ease, transform 0.35s ease;
        user-select: none;
      }
      .native-splash-frame {
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(197, 168, 128, 0.15);
        border-radius: 16px;
        pointer-events: none;
      }
      .native-splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -30px;
      }
      .native-splash-emblem {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        box-shadow: none;
      }
      .native-splash-title {
        margin-top: 24px;
        font-family: Georgia, 'Playfair Display', serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #DFCDAF;
        text-align: center;
      }
      .native-splash-slogan {
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #A68F68;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .native-splash-bar {
        width: 80px;
        height: 2px;
        background: #1E2024;
        border-radius: 2px;
        margin-top: 32px;
        overflow: hidden;
        position: relative;
      }
      .native-splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 32px;
        background: linear-gradient(90deg, transparent, #E8D7B8, transparent);
        animation: native-shimmer 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes native-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <!-- Tier 1 0ms Native Splash -->
    <div id="native-splash">
      <div class="native-splash-frame"></div>
      <div style="font-size: 9px; letter-spacing: 0.35em; color: rgba(197, 168, 128, 0.7); font-family: monospace; text-transform: uppercase;">
        HAUTE COUTURE ARCHIVE
      </div>
      <div class="native-splash-center">
        <div class="native-splash-emblem">
          <!-- Original Iconoir crown.svg path, atelier gold finish; MIT notice in docs/design/ICONOIR_LICENSE.md -->
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-d1-finish="atelier" data-d1-glyph="crown">
            <defs>
              <linearGradient id="native-d1-metal" x1="10%" y1="0%" x2="92%" y2="100%">
                <stop offset="0%" stop-color="#FFF1D2"/>
                <stop offset="18%" stop-color="#D6BD8E"/>
                <stop offset="43%" stop-color="#AA8250"/>
                <stop offset="61%" stop-color="#F4DCB1"/>
                <stop offset="83%" stop-color="#B68E58"/>
                <stop offset="100%" stop-color="#E6C99B"/>
              </linearGradient>
              <linearGradient id="native-d1-face" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#967447" stop-opacity=".42"/>
                <stop offset="48%" stop-color="#2C261D" stop-opacity=".92"/>
                <stop offset="100%" stop-color="#C5A16B" stop-opacity=".46"/>
              </linearGradient>
              <filter id="native-d1-engrave" x="-15%" y="-20%" width="130%" height="140%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceAlpha" stdDeviation=".27" result="soft"/>
                <feOffset in="soft" dx=".14" dy=".34" result="shifted"/>
                <feComposite in="SourceAlpha" in2="shifted" operator="out" result="upperInnerEdge"/>
                <feFlood flood-color="#33200E" flood-opacity=".66" result="darkCut"/>
                <feComposite in="darkCut" in2="upperInnerEdge" operator="in" result="cutShading"/>
                <feMerge>
                  <feMergeNode in="SourceGraphic"/>
                  <feMergeNode in="cutShading"/>
                </feMerge>
              </filter>
            </defs>
            <g stroke="#2A2015" stroke-width="2.35" fill="url(#native-d1-face)" stroke-linejoin="round"><path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z"/></g>
            <g stroke="url(#native-d1-metal)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" filter="url(#native-d1-engrave)"><path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z"/></g>
            <g stroke="#FFF0CF" stroke-width=".32" stroke-linecap="round" stroke-linejoin="round" opacity=".62" transform="translate(-.12 -.17)"><path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z"/></g>
            <g stroke="#4A3218" stroke-width=".3" stroke-linecap="round" stroke-linejoin="round" opacity=".64" transform="translate(.12 .16)"><path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z"/></g>
          </svg>
        </div>
        <div class="native-splash-title">LUXURY RENTAL</div>
        <div class="native-splash-slogan">Curated Luxury Living</div>
        <div class="native-splash-bar"></div>
      </div>
      <div style="font-size: 8px; letter-spacing: 0.25em; color: #7A6B53; text-transform: uppercase; font-family: monospace;">
        PARIS · MILAN · SEOUL · TOKYO
      </div>
    </div>
    <script>
      try {
        if (sessionStorage.getItem('lr_splash_viewed') === 'true' || location.search.includes('splash=false') || location.search.includes('code=') || location.search.includes('oauth=')) {
          var ns = document.getElementById('native-splash');
          if (ns) ns.remove();
        }
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
