<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- index.html의 <head> 내부 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>LuxuryRental - Curated Luxury Living</title>
    <style>
      /* Tier 1 Native Inline Splash Screen: 0ms instant display before JS bundle loads */
      #native-splash {
        position: fixed;
        inset: 0;
        background-color: #0B0C0E;
        background-image: radial-gradient(circle at 50% 45%, rgba(197, 168, 128, 0.09) 0%, rgba(11, 12, 14, 0) 70%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 40px 24px;
        box-sizing: border-box;
        transition: opacity 0.35s ease, transform 0.35s ease;
        user-select: none;
      }
      .native-splash-frame {
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(197, 168, 128, 0.15);
        border-radius: 16px;
        pointer-events: none;
      }
      .native-splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -30px;
      }
      .native-splash-emblem {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        box-shadow: none;
      }
      .native-splash-title {
        margin-top: 24px;
        font-family: Georgia, 'Playfair Display', serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #DFCDAF;
        text-align: center;
      }
      .native-splash-slogan {
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #A68F68;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .native-splash-bar {
        width: 80px;
        height: 2px;
        background: #1E2024;
        border-radius: 2px;
        margin-top: 32px;
        overflow: hidden;
        position: relative;
      }
      .native-splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 32px;
        background: linear-gradient(90deg, transparent, #E8D7B8, transparent);
        animation: native-shimmer 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes native-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <!-- Tier 1 0ms Native Splash -->
    <div id="native-splash">
      <div class="native-splash-frame"></div>
      <div style="font-size: 9px; letter-spacing: 0.35em; color: rgba(197, 168, 128, 0.7); font-family: monospace; text-transform: uppercase;">
        HAUTE COUTURE ARCHIVE
      </div>
      <div class="native-splash-center">
        <div class="native-splash-emblem">
          <!-- Original Iconoir crown.svg path, atelier gold finish; MIT notice in docs/design/ICONOIR_LICENSE.md -->
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="native-d1-gold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F2E2BF"/>
                <stop offset="40%" stop-color="#D7BA83"/>
                <stop offset="72%" stop-color="#B08D57"/>
                <stop offset="100%" stop-color="#E6CEA0"/>
              </linearGradient>
            </defs>
            <path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z" stroke="#30271B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".9" transform="translate(0.12 0.26)"/>
            <path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z" stroke="url(#native-d1-gold)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.2 17L21 7L14.7 10L12 7L9.3 10L3 7L4.8 17H19.2Z" stroke="#FFF4D6" stroke-width=".32" stroke-linecap="round" stroke-linejoin="round" opacity=".38" transform="translate(-0.16 -0.18)"/>
          </svg>
        </div>
        <div class="native-splash-title">LUXURY RENTAL</div>
        <div class="native-splash-slogan">Curated Luxury Living</div>
        <div class="native-splash-bar"></div>
      </div>
      <div style="font-size: 8px; letter-spacing: 0.25em; color: #7A6B53; text-transform: uppercase; font-family: monospace;">
        PARIS · MILAN · SEOUL · TOKYO
      </div>
    </div>
    <script>
      try {
        if (sessionStorage.getItem('lr_splash_viewed') === 'true' || location.search.includes('splash=false') || location.search.includes('code=') || location.search.includes('oauth=')) {
          var ns = document.getElementById('native-splash');
          if (ns) ns.remove();
        }
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
