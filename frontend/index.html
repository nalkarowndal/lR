<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuxuryRental - Curated Luxury Living</title>
  </head>
  <body>
    <div id="native-splash" class="lr-splash">
      <span class="lr-splash__status" role="status">LuxuryRental 로딩 중</span>
      <span class="lr-splash__eyebrow">HAUTE COUTURE ARCHIVE</span>
      <div class="lr-splash__brand">
        <img class="lr-splash__art" src="%%SPLASH_ART%%" width="104" height="104" alt="">
        <div class="lr-splash__wordmark">LUXURY RENTAL</div>
        <p class="lr-splash__slogan">Curated Luxury Living</p>
        <div class="lr-splash__bar" aria-hidden="true"></div>
      </div>
      <div class="lr-splash__footer">
        <span class="lr-splash__cities">PARIS · MILAN · SEOUL · TOKYO</span>
        <button class="lr-splash__skip" type="button">바로 시작하기</button>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('native-splash');
        const params = new URLSearchParams(location.search);
        let viewed = false;
        try { viewed = sessionStorage.getItem('lr_splash_viewed') === 'true'; } catch {}
        if (
          viewed || params.get('splash') === 'false' || params.has('code') || params.has('oauth') ||
          location.pathname.toLowerCase().includes('/callback') ||
          matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          splash.remove();
          return;
        }
        const timeout = setTimeout(() => splash.remove(), 5000);
        splash.addEventListener('click', () => {
          clearTimeout(timeout);
          try { sessionStorage.setItem('lr_splash_viewed', 'true'); } catch {}
          splash.remove();
        }, { once: true });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
