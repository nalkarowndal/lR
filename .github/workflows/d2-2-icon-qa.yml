name: D2-2 Boutique Sitewide Icon QA

on:
  push:
    branches:
      - design/d2-2-sitewide-boutique-icons
  pull_request:
    paths:
      - '.github/workflows/d2-2-icon-qa.yml'
      - 'frontend/src/components/icons/BoutiqueD22Icons.tsx'
      - 'frontend/src/components/icons/D22IconShapesA.ts'
      - 'frontend/src/components/icons/D22IconShapesB.ts'
      - 'frontend/src/components/icons/D22IconShapesC.ts'
      - 'frontend/src/components/ShopCategory.tsx'
      - 'frontend/src/components/ShopSearch.tsx'
      - 'frontend/src/components/ShopMyPage.tsx'
      - 'frontend/src/components/ShopSettings.tsx'
      - 'frontend/src/components/ShopSell.tsx'
      - 'frontend/src/components/ShopAdmin.tsx'
      - 'frontend/tests/d2-2-sitewide-icons.test.mjs'
      - 'frontend/scripts/qa-d2-2-browser.mjs'

permissions:
  contents: read

jobs:
  sitewide-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: D1 and D2-1 regression tests
        run: npm run test:d2
      - name: D2-2 cross-page icon regression
        run: node --test tests/d2-2-sitewide-icons.test.mjs
      - name: TypeScript + Vite production build
        run: npm run build
      - name: Focused static lint
        run: npx oxlint src/components/icons/BoutiqueD22Icons.tsx src/components/icons/D22IconShapesA.ts src/components/icons/D22IconShapesB.ts src/components/icons/D22IconShapesC.ts src/components/ShopCategory.tsx src/components/ShopSearch.tsx src/components/ShopMyPage.tsx src/components/ShopSettings.tsx src/components/ShopSell.tsx src/components/ShopAdmin.tsx
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Chrome QA for guest-accessible screens
        run: node scripts/qa-d2-2-browser.mjs
      - name: Upload D2-2 screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-2-guest-screens
          path: frontend/qa/d2-2-screens/
          if-no-files-found: warn
