name: D1 Boutique Icon QA

on:
  push:
    branches:
      - design/d1-iconoir-boutique-atelier
  pull_request:
    paths:
      - '.github/workflows/d1-icon-qa.yml'
      - 'frontend/src/components/icons/BoutiqueD1Icons.tsx'
      - 'frontend/src/components/ui/SplashScreen.tsx'
      - 'frontend/src/components/ShopMain.tsx'
      - 'frontend/index.html'
      - 'frontend/tests/d1-iconoir-icons.test.mjs'
      - 'frontend/package.json'

permissions:
  contents: read

jobs:
  d1-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: D1 Regression Test
        run: npm run test:d1
      - name: TypeScript and Vite Build
        run: npm run build
      - name: D1 Component Lint
        run: npx oxlint src/components/icons/BoutiqueD1Icons.tsx src/components/ui/SplashScreen.tsx
      - name: Install Korean font for screenshot QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-list :lang=ko | head -n 2
      - name: D1 Real Browser QA (360 390 430 px)
        run: node scripts/qa-d1-browser.mjs
      - name: Upload D1 screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-browser-qa-screens
          path: frontend/qa/d1-screens/
          if-no-files-found: warn
