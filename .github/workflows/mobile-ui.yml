name: Mobile UI checks
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile:
    defaults:
      run:
        working-directory: lR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'lR/package-lock.json'
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Expo SDK 58 native project preflight (no install changes)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/mobile && npx --yes expo-doctor@latest)
          (cd apps/mobile && npx expo install --check)
          git diff --exit-code -- package-lock.json package.json apps/mobile/package.json apps/mobile/app.json
      - name: React Native TypeScript check
        run: npm run typecheck:mobile
      - name: Rental date policy tests
        run: npm run test:mobile
      - name: Expo web bundle smoke build
        run: npm run build:mobile:web
