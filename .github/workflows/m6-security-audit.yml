name: M6 security advisory inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lR/package-lock.json'
      - 'lR/package.json'
      - 'lR/apps/api/package.json'
      - 'lR/apps/mobile/package.json'
      - 'lR/scripts/security/**'
      - '.github/workflows/m6-security-audit.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    defaults:
      run:
        working-directory: lR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'lR/package-lock.json'
      - name: Install exact dependency tree
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify security report parser
        run: node --test scripts/security/*.test.mjs
      - name: Collect registry advisory reports without mutating dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports
          # npm audit returns nonzero for *findings*, not only query errors.
          # The parser below detects invalid/missing advisory responses and fails closed.
          npm audit --json --omit=dev > security-reports/production.raw.json || true
          npm audit --json > security-reports/all.raw.json || true
          node scripts/security/audit-report.mjs security-reports/production.raw.json security-reports/all.raw.json security-reports/summary
          node scripts/security/audit-triage.mjs package-lock.json security-reports/production.raw.json security-reports/all.raw.json security-reports/triage
      - name: Export production iOS JS and source maps without shipping native binaries
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          (cd apps/mobile && npx expo export --platform ios --source-maps --no-bytecode --output-dir dist)
          node scripts/security/native-bundle-surface.mjs apps/mobile/dist security-reports/native-bundle-surface
      - name: Publish audit evidence (no private keys or app runtime secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-dependency-advisories-${{ github.run_id }}
          path: lR/security-reports/
          retention-days: 14
          if-no-files-found: warn
